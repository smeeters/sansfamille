<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Reconnecter les orphelins</title>
<link rel="stylesheet" href="ui-v5.css">
</head>
<body>
<header class="top">
  <span class="name">Reconnecter les orphelins</span>
  <div class="norm" id="scope" role="group" aria-label="Périmètre">
    <button data-s="page" aria-pressed="true" title="Toutes les racines orphelines de la page">Page<span class="sub">tout</span></button>
    <button data-s="selection" aria-pressed="false" title="Seulement ce qui est sélectionné">Sélection<span class="sub">ciblé</span></button>
  </div>
</header>

<main id="main">
  <section class="view">
    <div class="row">
      <button id="scan" class="btn">Scanner</button>
      <button id="save" class="text-btn">Sauvegarder une version</button>
    </div>
    <div id="sum" class="card" hidden></div>
    <div id="bar" class="card" hidden></div>
    <div id="list"></div>
    <p class="sm">Racine par racine ou en lot. L'orphelin n'est supprimé qu'après vérification et clic sur « Valider ». Après une suppression, le plugin peut mettre quelques minutes à répondre : ne relancez rien. Ctrl+Z annule.</p>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="ui-v5.js"></script>
</body>
</html>
