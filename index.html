<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  body{font:12px/1.4 system-ui,sans-serif;margin:0;padding:12px;background:var(--bg,#fff);color:var(--fg,#222)}
  h1{font-size:14px;margin:0 0 8px}
  .bar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  button{font:inherit;padding:5px 10px;border:1px solid #888;border-radius:6px;background:#f4f4f4;cursor:pointer}
  button.pri{background:#2a6df4;border-color:#2a6df4;color:#fff}
  button.dng{background:#c0392b;border-color:#c0392b;color:#fff}
  button:disabled{opacity:.45;cursor:default}
  .sum{padding:6px 8px;background:#f0f3f8;border-radius:6px;margin-bottom:8px;color:#222}
  .row{border:1px solid #ccc;border-radius:6px;padding:8px;margin-bottom:6px}
  .row b{word-break:break-all}
  .tag{display:inline-block;padding:0 6px;border-radius:8px;font-size:11px;background:#ddd;color:#222;margin-left:4px}
  .ok{background:#c9efd2}.warn{background:#ffe3a3}.ko{background:#f5b5b0}
  pre{white-space:pre-wrap;font-size:11px;background:#f7f7f7;color:#222;padding:6px;border-radius:4px;margin:6px 0 0;max-height:150px;overflow:auto}
  .act{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  [hidden]{display:none!important}
  details summary{cursor:pointer;margin-top:4px}
  .cand{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:4px;font-size:11px}
  .note{color:#666;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<h1>Reconnecter les orphelins</h1>
<div class="bar">
  <button id="scan" class="pri">1. Scanner la page</button>
  <button id="save">Sauvegarder une version</button>
</div>
<div id="sum" class="sum" hidden></div>
<div id="list"></div>
<div class="note">Racine par racine, avec confirmation. L'orphelin n'est supprimé qu'après vérification et clic sur « Valider ». Après la suppression, le plugin peut mettre quelques minutes à répondre : ne relancez rien. Ctrl+Z annule.</div>
<script>
const $ = (s) => document.querySelector(s);
const post = (m) => parent.postMessage(m, '*');
let rows = {};
const tag = (s) => ({MATCH_UNIQUE:'ok',VARIANTE_OK:'ok',MATCH_AMBIGU:'warn',VARIANTE_AMBIGUE:'warn',AUCUN_MATCH:'ko',VARIANTE_ABSENTE:'ko'}[s] || '');
const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const out = (id, txt) => { const el = document.getElementById('out-' + id); if (el) el.textContent = typeof txt === 'string' ? txt : JSON.stringify(txt, null, 1); };

$('#scan').onclick = () => post({ cmd: 'scan' });
$('#save').onclick = () => { $('#save').disabled = true; post({ cmd: 'save' }); };

function render(data) {
  const s = data.summary;
  $('#sum').hidden = false;
  $('#sum').innerHTML = `Page <b>${esc(s.page)}</b> · instances <b>${s.instances}</b> · racines orphelines <b>${s.orphanRoots}</b> · nœuds orphelins <b>${s.orphanNodes}</b> · reconnectables <b>${s.ready}</b><br><details><summary>Librairies (${s.connectedLibraries.filter((l) => l.components > 0).length} avec composants)</summary>${s.connectedLibraries.filter((l) => l.components > 0).map((l) => esc(l.name) + ' (' + l.components + ')').join(', ') || 'aucune'}</details>`;
  rows = {};
  $('#list').innerHTML = '';
  data.rows.forEach((r) => {
    rows[r.id] = r;
    const d = document.createElement('div');
    d.className = 'row';
    d.id = 'row-' + r.id;
    const can = !!r.componentId;
    d.innerHTML = `<b>${esc(r.name)}</b><span class="tag ${tag(r.status)}">${r.status}</span>
      ${r.variantInfo ? `<div>${r.variantInfo.variants} variantes. ${r.variantInfo.chosen ? 'Variante exacte : ' + esc(JSON.stringify(r.variantInfo.chosen.props)) : 'Aucune variante exacte (0 écart). Plus proches :'}</div>` : ''}
      ${r.variantInfo && !r.variantInfo.chosen ? (r.variantInfo.best || []).map((b) => `<div class="cand"><span>${b.n} écart(s) · ${esc(JSON.stringify(b.props))}<br>${esc((b.diffs || []).slice(0, 4).join(', '))}</span><button data-pick="${b.id}">Utiliser</button></div>`).join('') + '<div class="note">« Utiliser » = choix manuel, hors garde-fou du skill : vérifiez le résultat visuellement avant de valider.</div>' : ''}
      <div class="act">
        <button data-a="preview" ${can ? '' : 'disabled'}>Aperçu du delta</button>
        <button data-a="build" class="pri" ${can ? '' : 'disabled'}>Reconstruire</button>
        <button data-a="harvest">Harvest JSON</button>
      </div>
      <div class="act" id="conf-${r.id}" hidden>
        <button data-a="commit" class="dng">Valider : supprimer l'orphelin</button>
        <button data-a="cancel">Annuler</button>
      </div>
      <pre id="out-${r.id}" hidden></pre>`;
    d.querySelectorAll('button[data-a]').forEach((b) => b.onclick = () => {
      const a = b.dataset.a;
      const pre = document.getElementById('out-' + r.id); pre.hidden = false;
      if (a === 'build' || a === 'preview') { pre.textContent = 'Travail en cours…'; b.disabled = true; setTimeout(() => (b.disabled = !r.componentId), 4000); }
      post({ cmd: a, id: r.id, componentId: r.componentId });
    });
    d.querySelectorAll('button[data-pick]').forEach((b) => b.onclick = () => {
      r.componentId = b.dataset.pick;
      d.querySelectorAll('button[data-a="preview"],button[data-a="build"]').forEach((x) => (x.disabled = false));
      d.querySelectorAll('button[data-pick]').forEach((x) => (x.textContent = x === b ? 'Choisie ✓' : 'Utiliser'));
    });
    $('#list').appendChild(d);
  });
}

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || !m.type) return;
  if (m.type === 'scan') render(m);
  else if (m.type === 'save') { $('#save').disabled = false; $('#save').textContent = m.ok ? 'Version enregistrée ✓' : 'Échec sauvegarde'; }
  else if (m.type === 'preview') { const { type, id, ...rest } = m; out(id, rest); }
  else if (m.type === 'build') {
    const { type, id, ...rest } = m;
    out(id, rest);
    const c = document.getElementById('conf-' + id);
    if (c) c.hidden = !(m.built && m.ok);
  }
  else if (m.type === 'cancel') { out(m.id, m.removed ? 'Instance neuve supprimée, orphelin intact.' : m); document.getElementById('conf-' + m.id).hidden = true; }
  else if (m.type === 'commit') { out(m.id, m.requested ? 'Orphelin supprimé. Contrôle visuel dans l\'UI, puis relancez le scan quand le plugin répond (compteurs : orphanRoots −1).' : m); document.getElementById('conf-' + m.id).hidden = true; }
  else if (m.type === 'harvest') {
    if (!m.data) return out(m.id, 'Aucun harvest : lancez « Reconstruire » d\'abord.');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(m.data, null, 2)], { type: 'application/json' }));
    a.download = 'harvest-' + m.id + '.json'; a.click();
  }
  else if (m.type === 'error') out(m.id ?? '', 'Erreur : ' + m.message);
});
</script>
</body>
</html>
